<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MacLink Vision — Teste MoveNet</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0d1f1c; color: #e0f2ee; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  h1 { color: #6fb3a6; margin: 0; font-size: 22px; }
  .status { padding: 10px 16px; border-radius: 8px; font-weight: 600; text-align: center; width: 100%; max-width: 600px; }
  .status.loading { background: #1a3a35; color: #6fb3a6; }
  .status.success { background: #1b4a3a; color: #6fdfa6; }
  .status.error { background: #4a1b1b; color: #f9a0a0; }
  #result { background: #142a26; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-width: 600px; min-height: 100px; width: 100%; }
  #canvasWrap { position: relative; max-width: 600px; width: 100%; }
  #canvas { width: 100%; border-radius: 12px; background: #000; display: block; }
  input[type="file"] { color: #e0f2ee; }
  button { background: #1a7365; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
</head>
<body>
<h1>MacLink Vision — Teste MoveNet</h1>
<div id="status" class="status loading">Carregando TensorFlow.js...</div>
<input type="file" id="fileInput" accept="image/*" disabled>
<div id="canvasWrap"><canvas id="canvas"></canvas></div>
<div id="result">Aguardando modelo...</div>

<script>
(function() {
  "use strict";

  var statusEl = document.getElementById("status");
  var resultEl = document.getElementById("result");
  var fileInput = document.getElementById("fileInput");
  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");

  var model = null;

  // Modelo oficial do TF Hub/Kaggle — convertido com Converter v3.6.0 (compatível)
  // Fallback local: "/model.json" (convertido com v4.17.0 — pode falhar)
  var MODEL_URL = "https://www.kaggle.com/models/google/movenet/frameworks/tfJs/variations/singlepose-lightning/versions/4/model.json?tfjs-format=file";

  var KEYPOINTS = ["nariz","olho_esq","olho_dir","orelha_esq","orelha_dir","ombro_esq","ombro_dir","cotovelo_esq","cotovelo_dir","pulso_esq","pulso_dir","quadril_esq","quadril_dir","joelho_esq","joelho_dir","tornozelo_esq","tornozelo_dir"];
  var CONEXOES = [[0,1],[0,2],[1,3],[2,4],[5,6],[5,7],[7,9],[6,8],[8,10],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];

  function setStatus(msg, tipo) { statusEl.textContent = msg; statusEl.className = "status " + (tipo || "loading"); }
  function setResult(msg) { resultEl.textContent = msg; }

  // ---------- CARREGAMENTO ----------
  async function carregarModelo() {
    try {
      setStatus("Carregando TensorFlow.js...", "loading");
      await tf.ready();
      setStatus("TensorFlow.js pronto. Backend: " + tf.getBackend(), "loading");

      setStatus("Carregando modelo MoveNet oficial...", "loading");
      model = await tf.loadGraphModel(MODEL_URL);

      if (!model) throw new Error("loadGraphModel retornou nulo.");

      setStatus("Modelo carregado. Backend: " + tf.getBackend() + ". Selecione uma imagem.", "success");
      fileInput.disabled = false;

      var info = "Entrada: " + JSON.stringify(model.inputs ? model.inputs.map(function(i){return {name:i.name, shape:i.shape, dtype:i.dtype};}) : "?") + "\n";
      info += "Saída: " + JSON.stringify(model.outputs ? model.outputs.map(function(o){return {name:o.name, shape:o.shape, dtype:o.dtype};}) : "?");
      setResult(info);

    } catch (error) {
      console.error("Erro ao carregar modelo:", error);
      setStatus("Falha ao carregar o modelo: " + error.message, "error");
      setResult("Erro completo:\n" + (error.stack || error.message));
    }
  }

  // ---------- PRÉ-PROCESSAMENTO ----------
  function prepararImagem(img) {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    var tensor = tf.browser.fromPixels(img); // [H, W, 3] int32 RGB
    var resized = tf.image.resizeBilinear(tensor, [192, 192], true).toInt(); // [192, 192, 3] int32
    var batched = resized.expandDims(0); // [1, 192, 192, 3]
    tensor.dispose();
    resized.dispose();
    return batched;
  }

  // ---------- INFERÊNCIA ----------
  async function executarInferencia(img) {
    if (!model) { setStatus("Modelo não carregado.", "error"); return; }

    setStatus("Executando inferência...", "loading");

    var inputTensor = null;
    var outputTensor = null;

    try {
      inputTensor = prepararImagem(img);

      // executeAsync é necessário para grafos com operações de controle dinâmico
      outputTensor = await model.executeAsync(inputTensor);

      // Se retornar array, pegar o primeiro
      if (Array.isArray(outputTensor)) {
        outputTensor = outputTensor[0];
      }

      // Verificar rank
      if (outputTensor.rank === null || outputTensor.rank === undefined) {
        throw new Error("Saída com rank nulo. Modelo incompatível.");
      }

      // Achatar e extrair 51 valores (17 × 3)
      var flat = outputTensor.flatten().arraySync();
      if (flat.length < 51) {
        throw new Error("Saída com menos de 51 valores. Tamanho: " + flat.length);
      }

      var keypoints = [];
      for (var i = 0; i < 17; i++) {
        keypoints.push([flat[i*3], flat[i*3+1], flat[i*3+2]]);
      }

      desenharEsqueleto(keypoints, img.width, img.height);

      var linhas = [];
      for (var j = 0; j < keypoints.length; j++) {
        var kp = keypoints[j];
        linhas.push(KEYPOINTS[j].padEnd(14) + " y=" + kp[0].toFixed(3) + " x=" + kp[1].toFixed(3) + " score=" + kp[2].toFixed(3));
      }
      setResult("17 keypoints detectados:\n\n" + linhas.join("\n"));
      setStatus("Inferência concluída com sucesso.", "success");

    } catch (error) {
      console.error("Erro na inferência:", error);
      setStatus("Erro na inferência: " + error.message, "error");
      setResult("Erro completo:\n" + (error.stack || error.message));
    } finally {
      if (inputTensor) inputTensor.dispose();
      if (outputTensor) outputTensor.dispose();
    }
  }

  // ---------- DESENHO ----------
  function desenharEsqueleto(keypoints, w, h) {
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#00ffcc";
    ctx.fillStyle = "#ff0066";

    CONEXOES.forEach(function(par) {
      var a = keypoints[par[0]];
      var b = keypoints[par[1]];
      if (a[2] > 0.3 && b[2] > 0.3) {
        ctx.beginPath();
        ctx.moveTo(a[1] * w, a[0] * h);
        ctx.lineTo(b[1] * w, b[0] * h);
        ctx.stroke();
      }
    });

    keypoints.forEach(function(kp) {
      if (kp[2] > 0.3) {
        ctx.beginPath();
        ctx.arc(kp[1] * w, kp[0] * h, 5, 0, 2 * Math.PI);
        ctx.fill();
      }
    });
  }

  // ---------- EVENTO ----------
  fileInput.addEventListener("change", function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var img = new Image();
    img.onload = function() { executarInferencia(img); };
    img.onerror = function() { setStatus("Erro ao carregar a imagem.", "error"); };
    img.src = URL.createObjectURL(file);
  });

  // ---------- INICIALIZAÇÃO ----------
  if (typeof tf === "undefined") {
    setStatus("TensorFlow.js não foi carregado. Verifique o CDN.", "error");
    setResult("A tag <script> do TensorFlow.js falhou.");
  } else {
    carregarModelo();
  }

})();
</script>
</body>
</html>
